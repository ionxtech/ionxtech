name: Submit Sitemap URLs to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "sitemap.xml"
      - "assets/js/site-data.js"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait 30s for Cloudflare Pages deployment propagation
        run: sleep 30

      - name: Submit URLs to IndexNow API
        run: node assets/js/submit-indexnow.mjs
